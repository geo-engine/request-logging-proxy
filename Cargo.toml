[package]
name = "request-logging-proxy"
version = "0.2.0"
edition = "2024"
authors = ["Christian Beilschmidt <christian.beilschmidt@geoengine.de>"]
description = "A simple HTTP proxy that logs requests and responses"
license-file = "LICENSE"
repository = "https://github.com/geo-engine/request-logging-proxy"
keywords = ["http", "proxy", "logging"]
categories = [
    "command-line-utilities",
    "development-tools::debugging",
    "network-programming",
    "web-programming",
]
exclude = [".github/*", "target/*"]

# configure default clippy lints
[workspace.lints.clippy]
# Set group priorities to -1 so individual lints (default priority 0) override them cleanly
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# disable some pedantic lints
default_trait_access = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
non_ascii_literal = "allow"
option_if_let_else = "allow"
similar_names = "allow"
wildcard_imports = "allow"

# enable some restriction lints
dbg_macro = "warn"
exit = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.12"
clap = { version = "4.6", features = ["env", "derive"] }
flate2 = "1.1"
http = "1.5"
http-body-util = "0.1"
hyper = { version = "1.11", features = [] }
hyper-util = { version = "0.1", features = [
    "client",
    "server-auto",
    "server-graceful",
] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal"] }
url = { version = "2.5", features = [] }

[dev-dependencies]
pretty_assertions = "1.4"
